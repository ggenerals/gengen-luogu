    <script>
        (async function() {
            // ---------- 确保 hljs 存在 ----------
            if (typeof hljs === 'undefined') {
                console.warn('hljs 未加载，代码高亮已禁用');
                window.hljs = {
                    highlight: (code) => ({ value: code }),
                    highlightElement: (el) => {}
                };
            }

            // ---------- 增强扩展语法处理 (支持嵌套容器、可变冒号数量、open属性、epigraph) ----------
            function preprocessMarkdownExtensions(raw) {
                if (!raw) return raw;

                // 基于行的容器指令解析器 (支持 ::: 及以上嵌套)
                function convertContainerDirectives(text) {
                    const lines = text.split('\n');
                    const stack = []; // 每个元素: {level, type, title, attrs, content: []}
                    const rootPieces = [];

                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i];
                        // 匹配开始行：至少三个冒号 + 类型名 + 可选[标题] + 可选{属性}
                        let startMatch = line.match(/^(:::+)(\w+)(?:\[([^\]]*)\])?(?:\{([^}]*)\})?\s*$/);
                        if (startMatch && startMatch[1].length >= 3) {
                            const level = startMatch[1].length;
                            const type = startMatch[2];
                            const title = startMatch[3] || '';
                            const attrs = startMatch[4] || '';
                            const node = { level, type, title, attrs, content: [] };
                            stack.push(node);
                            continue;
                        }

                        // 匹配结束行：与栈顶相同数量的冒号 (可能后面有空格)
                        if (stack.length > 0) {
                            const top = stack[stack.length - 1];
                            const endPattern = new RegExp(`^:{${top.level}}\\s*$`);
                            if (endPattern.test(line)) {
                                // 弹出栈顶，生成 HTML
                                const node = stack.pop();
                                // 拼接内部内容 (保留换行)
                                let innerContent = node.content.join('');
                                
                                // 根据 type 构建 HTML
                                let html = '';
                                const attrs = node.attrs;
                                const openClass = attrs.includes('open') ? ' open' : '';
                                
                                if (node.type === 'align') {
                                    const align = attrs.trim() || 'left'; // 属性值直接作为对齐方向
                                    html = `<div class="markdown-align-${align}${openClass}">${innerContent}</div>`;
                                } else if (node.type === 'epigraph') {
                                    html = `<div class="markdown-epigraph${openClass}">${innerContent}</div>`;
                                } else {
                                    // callouts: info, warning, success, error, note, tip, caution 等
                                    const titleHtml = node.title ? `<div class="markdown-alert-title">${node.title}</div>` : '';
                                    html = `<div class="markdown-alert markdown-alert-${node.type}${openClass}">${titleHtml}${innerContent}</div>`;
                                }

                                // 将生成的 HTML 添加到父节点或根
                                if (stack.length > 0) {
                                    stack[stack.length - 1].content.push(html);
                                } else {
                                    rootPieces.push(html);
                                }
                                continue;
                            }
                        }

                        // 普通行：保留原样，加上换行符保证 Markdown 解析正确
                        if (stack.length > 0) {
                            stack[stack.length - 1].content.push(line + '\n');
                        } else {
                            rootPieces.push(line + '\n');
                        }
                    }

                    // 处理未闭合的容器（将它们全部闭合并附加到根）
                    while (stack.length > 0) {
                        const node = stack.pop();
                        let innerContent = node.content.join('');
                        let html = '';
                        const attrs = node.attrs;
                        const openClass = attrs.includes('open') ? ' open' : '';
                        
                        if (node.type === 'align') {
                            const align = attrs.trim() || 'left';
                            html = `<div class="markdown-align-${align}${openClass}">${innerContent}</div>`;
                        } else if (node.type === 'epigraph') {
                            html = `<div class="markdown-epigraph${openClass}">${innerContent}</div>`;
                        } else {
                            const titleHtml = node.title ? `<div class="markdown-alert-title">${node.title}</div>` : '';
                            html = `<div class="markdown-alert markdown-alert-${node.type}${openClass}">${titleHtml}${innerContent}</div>`;
                        }
                        
                        if (stack.length > 0) {
                            stack[stack.length - 1].content.push(html);
                        } else {
                            rootPieces.push(html);
                        }
                    }

                    return rootPieces.join('');
                }

                // 应用容器指令转换
                return convertContainerDirectives(raw);
            }

            // ---------- 获取云剪切板 ID ----------
            let pasteId = null;
            const path = window.location.pathname;
            const pathMatch = path.match(/\/paste\/([a-z0-9]+)/);
            if (pathMatch) pasteId = pathMatch[1];
            if (!pasteId && window.location.hash) pasteId = window.location.hash.replace(/^#/, '').trim();
            if (!pasteId) {
                const params = new URLSearchParams(window.location.search);
                pasteId = params.get('id');
            }

            if (!pasteId || pasteId.length < 3) {
                pasteId = 'yx7hyde9'; // 默认演示ID
            }

            document.getElementById('breadcrumb-current').innerText = `ID: ${pasteId}`;

            // ---------- 设置 marked ----------
            marked.setOptions({
                gfm: true,
                breaks: true,
                smartypants: true,
                highlight: (code, lang) => {
                    const validLang = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language: validLang }).value;
                },
                // 添加对数学公式的特殊处理，避免被解析为HTML
                extensions: [{
                    name: 'math',
                    level: 'inline',
                    start: (src) => src.match(/\$\$[\s\S]*?\$\$/)?.index,
                    tokenizer: (src) => {
                        const match = src.match(/^\$\$[\s\S]*?\$\$/);
                        if (match) {
                            return {
                                type: 'math',
                                raw: match[0],
                                text: match[0]
                            };
                        }
                    },
                    renderer: (token) => token.text
                }]
            });

            // ---------- DOM 元素 ----------
            const titleEl = document.getElementById('dynamic-article-title');
            const authorAvatar = document.getElementById('author-avatar');
            const authorLink = document.getElementById('author-link');
            const saveTimeEl = document.getElementById('save-time');
            const originalBtn = document.getElementById('original-btn');
            const copyBtn = document.getElementById('copy-btn');
            const updateBtn = document.getElementById('update-btn');
            const markdownBody = document.getElementById('markdown-content');
            const tocList = document.getElementById('toc-list');
            const breadcrumbSpan = document.getElementById('breadcrumb-current');

            // ---------- 加载云剪切板数据 ----------
            async function loadPaste(forceUpdate = false) {
                let apiUrl = `https://luogu.qzz.io/api/p/${pasteId}`;
                if (forceUpdate) {
                    apiUrl += '?update=1';
                }

                try {
                    const resp = await fetch(apiUrl, { mode: 'cors' });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();
                    if (!data.success || data.type !== 'paste') {
                        throw new Error(data.message || '无效的云剪切板数据');
                    }

                    // 设置标题：作者名 + "的云剪切板"
                    const displayTitle = data.author.name + "的云剪切板";
                    titleEl.innerText = displayTitle;
                    document.title = `${displayTitle} - GenGen 洛谷国际`;
                    breadcrumbSpan.innerText = displayTitle;

                    // 作者信息
                    authorAvatar.src = `https://cdn.luogu.com.cn/upload/usericon/${data.author.uid}.png`;
                    authorLink.href = `https://luogu.store/u/${data.author.uid}`;
                    authorLink.innerText = data.author.name;

                    // 保存时间
                    const ts = data.updated_at > 1e12 ? data.updated_at : data.updated_at * 1000;
                    const d = new Date(ts);
                    const formatted = d.toLocaleString('zh-CN', { 
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', second: '2-digit',
                        hour12: false 
                    }).replace(/\//g, '-').replace(',', '');
                    saveTimeEl.querySelector('.value').innerText = formatted;

                    // 启用按钮
                    originalBtn.disabled = false;
                    copyBtn.disabled = false;

                    originalBtn.onclick = () => {
                        if (data.original_url) window.open(data.original_url.trim(), '_blank');
                    };

                    copyBtn.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(data.content);
                            const old = copyBtn.innerText;
                            copyBtn.innerText = '已复制';
                            copyBtn.disabled = true;
                            setTimeout(() => {
                                copyBtn.innerText = old;
                                copyBtn.disabled = false;
                            }, 1500);
                        } catch {
                            alert('复制失败，请手动复制');
                        }
                    };

                    // ---------- 预处理扩展语法 (增强版) ----------
                    let processedContent = preprocessMarkdownExtensions(data.content);

                    // 渲染 Markdown
                    const rawHtml = marked.parse(processedContent);
                    // 确保图片正常显示：DOMPurify 默认允许 img，但显式配置更安全
                    const cleanHtml = DOMPurify.sanitize(rawHtml, { 
                        ADD_TAGS: ['span', 'div', 'math'], 
                        ADD_ATTR: ['class', 'src', 'alt'],
                        ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|callto|cid|xmpp|xxx):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i
                    });
                    markdownBody.innerHTML = cleanHtml;

                    // 渲染数学公式
                    renderMathInElement(markdownBody, {
                        delimiters: [
                            { left: "$$", right: "$$", display: true },
                            { left: "$", right: "$", display: false }
                        ],
                        throwOnError: false
                    });

                    // 代码高亮
                    markdownBody.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });

                    // ---------- 生成目录 ----------
                    const headers = markdownBody.querySelectorAll('h1, h2, h3');
                    if (headers.length > 0) {
                        tocList.innerHTML = '';
                        headers.forEach((h, index) => {
                            const level = parseInt(h.tagName[1]);
                            let text = h.innerText;
                            if (!h.id) {
                                h.id = `toc-header-${index}`;
                            }
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.href = `#${h.id}`;
                            a.innerText = text;
                            a.classList.add(`toc-h${level}`);
                            li.appendChild(a);
                            tocList.appendChild(li);
                        });
                    } else {
                        tocList.innerHTML = '<li style="color: var(--text-muted);">无标题</li>';
                    }

                } catch (err) {
                    console.error('加载失败:', err);
                    titleEl.innerText = '加载失败';
                    markdownBody.innerHTML = `<div class="error-message">错误：${err.message}</div>`;
                    breadcrumbSpan.innerText = '错误';
                }
            }

            // 首次加载
            await loadPaste(false);

            // 更新按钮：强制重新加载
            updateBtn.onclick = () => {
                markdownBody.innerHTML = '<div class="loading"><div class="spinner"></div><p>更新中...</p></div>';
                loadPaste(true);
            };
        })();
    </script>
