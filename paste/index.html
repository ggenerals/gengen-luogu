    <script>
    (function() {
        // ==================== Markdown 渲染引擎 ====================
        if (typeof hljs === 'undefined') {
            window.hljs = { highlight: (code) => ({ value: code }), highlightElement: () => {} };
        }

        const customExtensions = [
            {
                name: 'alignBlock', level: 'block',
                start(src) { return src.match(/^:::\s*align\s*\{([^}]+)\}/)?.index; },
                tokenizer(src) {
                    const match = src.match(/^:::\s*align\s*\{([^}]+)\}([\s\S]*?)\n:::/);
                    if (match) return { type: 'alignBlock', raw: match[0], align: match[1].trim(), content: match[2].trim() };
                },
                renderer(token) { return `<div class="align-${token.align}">${marked.parse(token.content)}</div>`; }
            },
            {
                name: 'epigraph', level: 'block',
                start(src) { return src.match(/^:::\s*epigraph(\[([^\]]+)\])?/)?.index; },
                tokenizer(src) {
                    const match = src.match(/^:::\s*epigraph(\[([^\]]+)\])?\s*([\s\S]*?)\s*:::/);
                    if (match) return { type: 'epigraph', raw: match[0], author: match[2] || '', content: match[3].trim() };
                },
                renderer(token) {
                    const authorPart = token.author ? `<p>${token.author}</p>` : '<p>unknown author</p>';
                    return `<div class="epigraph">${marked.parse(token.content)}${authorPart}</div>`;
                }
            },
            {
                name: 'foldable', level: 'block',
                start(src) { return src.match(/^:{3,}/)?.index; },
                tokenizer(src) {
                    const match = src.match(/^(:{3,})\s*(\w+)?(\[([^\]]+)\])?(\s*\{([^}]+)\})?\s*([\s\S]*?)\s*\1/);
                    if (match && ['info','warning','success','error','bug','flask'].includes(match[2])) {
                        return { type: 'foldable', raw: match[0], foldType: match[2]||'info', title: match[4]||'', options: match[6]||'', content: match[7].trim() };
                    }
                },
                renderer(token) {
                    const isOpen = token.options.includes('open');
                    return `<details class="foldable ${token.foldType}" ${isOpen?'open':''}><summary>${token.title||'点击展开'}</summary>${marked.parse(token.content)}</details>`;
                }
            }
        ];

        marked.use({ extensions: customExtensions });

        const renderer = new marked.Renderer();
        renderer.code = function(codeObj, language) {
            const code = typeof codeObj === 'string' ? codeObj : codeObj.text;
            const lang = language || 'cpp';
            let highlighted = code;
            try { highlighted = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch(e) {}
            return `<div class="code-container"><pre><code class="language-${lang}">${highlighted}</code></pre></div>`;
        };

        marked.setOptions({ breaks: false, gfm: true, mangle: false, headerIds: false, renderer });

        function renderMarkdown(text) {
            text = text.replace(/(^|\s)\$\$\s*\n([\s\S]*?)\n\s*\$\$(?=\s|$)/gm, '$1\n$$$$$2$$$$\n');
            text = text.replace(/([^\n])\n(\|.*\|)\n(\|.*[-:].*\|)/g, '$1\n\n$2\n$3');
            const rawHtml = marked.parse(text);
            const cleanHtml = DOMPurify.sanitize(rawHtml, {
                ADD_TAGS: ['span','div','math','details','summary','i','font'],
                ADD_ATTR: ['class','src','alt','data-math','open','referrerpolicy','crossorigin'],
                ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|callto|cid|xmpp|xxx):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i
            });
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = cleanHtml;
            renderMathInElement(tempDiv, {
                delimiters: [
                    {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
                    {left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}
                ], strict: false, escape: false,
                preProcess: (math) => math.replace(/\\(\r?\n)/g, '\\\\$1')
            });
            tempDiv.querySelectorAll('img').forEach(img => {
                img.setAttribute('referrerpolicy','no-referrer');
                img.setAttribute('crossorigin','anonymous');
            });
            return tempDiv.innerHTML;
        }

        // ==================== 路由与状态管理 ====================
        const path = window.location.pathname;
        const pathMatch = path.match(/\/paste\/([a-z0-9]+)/);
        let articleId = null;

        if (pathMatch) articleId = pathMatch[1];
        else if (window.location.hash) articleId = window.location.hash.replace(/^#/,'').trim();
        else articleId = new URLSearchParams(window.location.search).get('id');

        const isSquareMode = !articleId || articleId.length < 3;

        // DOM 引用
        const els = {
            square: document.getElementById('article-square'),
            grid: document.getElementById('square-grid'),
            header: document.getElementById('article-header'),
            content: document.getElementById('markdown-content'),
            title: document.getElementById('dynamic-article-title'),
            breadcrumb: document.getElementById('breadcrumb-current'),
            saveTime: document.getElementById('save-time'),
            originalBtn: document.getElementById('original-btn'),
            copyBtn: document.getElementById('copy-btn'),
            updateBtn: document.getElementById('update-btn'),
            toc: document.getElementById('toc-list'),
            avatar: document.getElementById('author-avatar'),
            authorLink: document.getElementById('author-link')
        };

        // ==================== 剪贴板广场模式 ====================
        async function loadSquare() {
            // 🆕 启用广场布局模式
            document.body.classList.add('square-mode');

            els.square.style.display = 'block';
            els.header.style.display = 'none';
            els.content.style.display = 'none';
            els.saveTime.style.display = 'none';
            els.originalBtn.style.display = 'none';
            els.copyBtn.style.display = 'none';
            els.toc.parentElement.style.display = 'none';
            els.updateBtn.innerText = '换一批';
            document.title = '剪贴板广场 · GenGen 洛谷国际';
            els.breadcrumb.innerText = '剪贴板广场';

            els.grid.innerHTML = `<div class="loading-spinner"><div class="spinner"></div><p>正在加载剪贴板广场...</p></div>`;

            try {
                const resp = await fetch('https://luogu.qzz.io/api/rand/p', { mode: 'cors' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (!json.success || !Array.isArray(json.data)) throw new Error('接口返回格式错误');

                els.grid.innerHTML = '';
                json.data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'square-card';
                    card.href = `//luogu.qzz.io/paste/${item.id}`;

                    // 提取纯文本摘要
                    const excerpt = (item.content || '')
                        .replace(/:{3,}.*\n?/g, '')
                        .replace(/[#*`>\[\]()!_~\\$\n]/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                        .substring(0, 100);

                    const authorName = typeof item.author === 'string' 
                        ? item.author 
                        : (item.author?.name || '匿名');

                    card.innerHTML = `
                        <div class="card-title">${DOMPurify.sanitize(item.title)}</div>
                        <div class="card-excerpt">${DOMPurify.sanitize(excerpt)}...</div>
                        <div class="card-meta">
                            <span class="card-author"><i class="fas fa-user-pen"></i> ${DOMPurify.sanitize(authorName)}</span>
                        </div>
                    `;
                    els.grid.appendChild(card);
                });
            } catch(err) {
                console.error('广场加载失败:', err);
                els.grid.innerHTML = `<div class="loading-spinner" style="color:#f87171;">
                    <i class="fas fa-exclamation-triangle" style="font-size:2rem;margin-bottom:8px;"></i>
                    <p>加载失败：${err.message}</p>
                    <p style="font-size:0.85rem;opacity:0.7;">点击「换一批」重试</p>
                </div>`;
            }
        }

        // ==================== 单篇剪贴板模式 ====================
        async function loadArticle(forceUpdate = false) {
            // 🆕 退出广场布局模式
            document.body.classList.remove('square-mode');

            els.square.style.display = 'none';
            els.header.style.display = '';
            els.content.style.display = '';
            els.saveTime.style.display = '';
            els.originalBtn.style.display = '';
            els.copyBtn.style.display = '';
            els.toc.parentElement.style.display = '';
            els.updateBtn.innerText = '更新内容';

            const apiUrl = `https://luogu.qzz.io/api/p/${articleId}${forceUpdate ? '?update=1' : ''}`;

            try {
                const resp = await fetch(apiUrl, { mode: 'cors' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                if (!data.success || data.type !== 'paste') throw new Error(data.message || '无效的剪贴板数据');

                els.title.innerText = data.title;
                document.title = `${data.title} - GenGen 洛谷国际`;
                els.breadcrumb.innerText = data.title;

                if (data.author && typeof data.author === 'object') {
                    els.avatar.src = `https://cdn.luogu.com.cn/upload/usericon/${data.author.uid}.png`;
                    els.authorLink.href = `https://luogu.com.cn/user/${data.author.uid}`;
                    els.authorLink.innerText = data.author.name;
                } else {
                    els.avatar.src = 'https://luogu.qzz.io/lgge.svg';
                    els.authorLink.href = '#';
                    els.authorLink.innerText = data.author || '未知';
                }

                const ts = data.updated_at > 1e12 ? data.updated_at : data.updated_at * 1000;
                els.saveTime.querySelector('.value').innerText = new Date(ts).toLocaleString('zh-CN', {
                    year:'numeric',month:'2-digit',day:'2-digit',
                    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
                }).replace(/\//g,'-').replace(',','');

                els.originalBtn.disabled = false;
                els.copyBtn.disabled = false;

                els.originalBtn.onclick = () => {
                    const url = data.original_url || data.url || `https://luogu.qzz.io/article/${data.id}`;
                    window.open(url.trim(), '_blank');
                };

                els.copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(data.content);
                        const old = els.copyBtn.innerText;
                        els.copyBtn.innerText = '已复制'; els.copyBtn.disabled = true;
                        setTimeout(() => { els.copyBtn.innerText = old; els.copyBtn.disabled = false; }, 1500);
                    } catch { alert('复制失败'); }
                };

                els.content.innerHTML = renderMarkdown(data.content);

                // 目录生成
                const headers = els.content.querySelectorAll('h1, h2, h3');
                els.toc.innerHTML = '';
                if (headers.length > 0) {
                    headers.forEach((h, i) => {
                        if (!h.id) h.id = `toc-header-${i}`;
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = `#${h.id}`;
                        a.innerText = h.innerText;
                        a.classList.add(`toc-h${h.tagName[1]}`);
                        a.onclick = (e) => { e.preventDefault(); document.getElementById(h.id)?.scrollIntoView({behavior:'smooth'}); };
                        li.appendChild(a);
                        els.toc.appendChild(li);
                    });
                } else {
                    els.toc.innerHTML = '<li style="color:var(--text-muted)">无标题</li>';
                }
            } catch(err) {
                console.error('加载失败:', err);
                els.title.innerText = '加载失败';
                els.content.innerHTML = `<div class="error-message" style="color:#f87171;padding:40px;text-align:center;">错误：${err.message}</div>`;
                els.breadcrumb.innerText = '错误';
            }
        }

        // ==================== 入口分发 ====================
        if (isSquareMode) {
            loadSquare();
            els.updateBtn.onclick = () => loadSquare();
        } else {
            loadArticle(false);
            els.updateBtn.onclick = () => {
                els.content.innerHTML = '<div class="loading"><div class="spinner"></div><p>更新中...</p></div>';
                loadArticle(true);
            };
        }
    })();
    </script>
